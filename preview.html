<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xem trước portfolio Khắc Thành trên máy tính và điện thoại.">
  <link rel="icon" href="favicon.ico?v=5" sizes="any"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=5"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=5"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=5">
  <title>Xem giao diện — Khắc Thành</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0}body{background:#f5f5f3;color:#171717;font-family:Inter,Arial,sans-serif}
    .preview-bar{height:74px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border-bottom:1px solid #dededb}
    .preview-brand{font-size:21px;font-weight:700;letter-spacing:-.065em;text-decoration:none;color:inherit;white-space:nowrap}
    .preview-switch{display:flex;padding:4px;border:1px solid #dededb;border-radius:100px;background:#f7f7f6;gap:2px}
    .preview-switch button{border:0;border-radius:100px;padding:9px 17px;background:transparent;color:#555;cursor:pointer;font:600 13px Inter,Arial,sans-serif}
    .preview-switch button[aria-pressed="true"]{background:#171717;color:#fff}
    .preview-open{color:#171717;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
    .preview-open:hover{text-decoration:underline}
    .preview-stage{min-height:calc(100vh - 74px);padding:32px 24px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
    .frame-shell{width:1440px;max-width:none;flex:none;border:1px solid #d6d6d3;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.13);transition:width .3s ease,border-radius .3s ease}
    .frame-shell[data-device="mobile"]{width:390px;border-radius:24px;overflow:hidden}
    .frame-shell iframe{display:block;width:100%;height:850px;border:0;background:#fff}
    .frame-shell[data-device="mobile"] iframe{height:780px}
    @media(max-width:620px){.preview-bar{height:auto;min-height:68px;padding:10px 14px;flex-wrap:wrap}.preview-brand{font-size:17px}.preview-switch button{padding:8px 12px}.preview-open{display:none}.preview-stage{padding:18px 8px}}
  </style>
</head>
<body>
  <header class="preview-bar">
    <a class="preview-brand" href="index.html">Khắc Thành.</a>
    <div class="preview-switch" role="group" aria-label="Chọn giao diện xem trước">
      <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
      <button type="button" data-device="mobile" aria-pressed="false">Mobile</button>
    </div>
    <a class="preview-open" href="index.html">Mở website ↗</a>
  </header>
  <main class="preview-stage">
    <div class="frame-shell" data-device="desktop"><iframe src="index.html" title="Portfolio Khắc Thành - bản xem trước"></iframe></div>
  </main>
  <script>
    const shell = document.querySelector('.frame-shell');
    const buttons = [...document.querySelectorAll('[data-device]')].filter(el => el.tagName === 'BUTTON');
    function choose(device) {
      shell.dataset.device = device;
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.device === device)));
      const available = window.innerWidth - (window.innerWidth < 620 ? 16 : 48);
      const target = device === 'desktop' ? 1440 : 390;
      shell.style.zoom = Math.min(1, available / target);
    }
    buttons.forEach(button => button.addEventListener('click', () => choose(button.dataset.device)));
    window.addEventListener('resize', () => choose(shell.dataset.device));
    choose(window.innerWidth < 620 ? 'mobile' : 'desktop');
  </script>
</body>
</html>
